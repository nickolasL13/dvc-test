stages:
  ingest:
    cmd: python3 src/ingest.py
    deps:
    - src/ingest.py
    outs:
    - data/raw/data.csv
  prepare:
    cmd: python3 src/prepare.py
    deps:
    - data/raw/data.csv
    params:
    - prepare.test_size
    - prepare.random
    outs:
    - data/test/df_X_test.csv
    - data/test/df_y_test.csv
    - data/train/df_X_train.csv
    - data/train/df_y_train.csv
